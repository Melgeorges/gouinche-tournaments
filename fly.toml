# Remplacer "gouinche-tournament" par le nom choisi lors du `fly launch`
app = "gouinche-tournament"
primary_region = "cdg"  # Paris Charles-de-Gaulle

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/gouinche.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Volume persistant pour la base SQLite
[[mounts]]
  source = "gouinche_data"
  destination = "/data"
  initial_size = "1gb"
